name: CI

on:
  pull_request:
  push:
    branches:
      - feat/mysana-qa-agent-v0.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app browser core dashboard qa tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
